<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <title>G1_Cocos</title>

  <!--http://www.html5rocks.com/en/mobile/mobifying/-->
  <meta name="viewport"
        content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,minimal-ui=true"/>

  <!--https://developer.apple.com/library/safari/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <!-- force webkit on 360 -->
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <!-- force edge on IE -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <!-- 禁用快取：每次開啟都重新載入 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="msapplication-tap-highlight" content="no">

  <!-- force full screen on some browser -->
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>

  <!-- force screen orientation on some browser -->
  <meta name="screen-orientation" content="auto"/>
  <meta name="x5-orientation" content="auto">

  <!--fix fireball/issues/3568 -->
  <meta name="x5-page-mode" content="app">
  <meta name="apple-touch-fullscreen" content="yes">

  <!--<link rel="apple-touch-icon" href=".png" />-->
  <!--<link rel="apple-touch-icon-precomposed" href=".png" />-->

  <link rel="stylesheet" type="text/css" href="style.f76d1.css"/>
  <link rel="stylesheet" type="text/css" href="style-mobile.3a0f9.css"/>
  <link rel="icon" href="favicon.ico"/>
</head>
<body>
  <div id="GameDiv" class="game-wrapper">
    <div id="Cocos3dGameContainer">
      <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
    </div>
  </div>
  <div id="splash">
    <img src="./splash.b8bca.png" id="splash-bg" alt="splash"/>
    <div>
      <img src="./logo.44e95.webp" id="logo" alt="logo"/>
    </div>
    <div>
      <img src="./loading.9acfc.gif" id="loading" alt="loading"/>
    </div>
  </div>

  

<!-- Polyfills bundle. -->

<script src="src/polyfills.bundle.5adbf.js" charset="utf-8"> </script>


<!-- SystemJS support. -->
<script src="src/system.bundle.543e6.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.210ca.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
    System.import('./index.fb240.js').catch(function(err) { console.error(err); })
</script>


  <script>
  (function () {
    // VConsole: 若有載入 VConsole 腳本則啟用
    if (typeof VConsole !== 'undefined') {
      window.vConsole = new VConsole();
    }

    var splash = document.getElementById('splash');
    splash.style.display = 'block';

    function hideSplash() {
      splash.style.display = 'none';
    }

    // 輪詢等待 Cocos Creator 3 引擎載入，監聽場景啟動後隱藏 splash
    function waitForEngine() {
      if (typeof cc !== 'undefined' && cc.director) {
        cc.director.once(cc.Director.EVENT_AFTER_SCENE_LAUNCH, hideSplash);
        return;
      }
      setTimeout(waitForEngine, 50);
    }
    waitForEngine();
  })();
  </script>
</body>
</html>
